    --elev: #E9F8F4;
    --elev-2: #DCF3ED;
    --border: #D2F0E8;
    --border-soft: #E2F7F1;
    --text-0: #37504E;
    --text-1: #7E9B97;
    --text-2: #AFCCC7;
    --c1: #6FDCC8;
    --c2: #7FB8F5;
    --track: #E9F6F3;
    --ok: #4FC9A0;
    --ok-glow: rgba(79, 201, 160, .55);
    --warn: #FFB067;
    --body-fill: #FFFFFF;
    --body-stroke: #CFEFE7;
    --blush: #A9E3D6;
    --ink: #37504E;
    --glow: rgba(111, 220, 200, .40);
    --shadow: rgba(127, 184, 245, .16);
  }
  /* ================= 主题：夜空 ================= */
  [data-theme="night"] {
    --page-1: #1D1730;
    --page-2: #0D0A17;
    --page-blob-1: rgba(255, 143, 192, .18);
    --page-blob-2: rgba(169, 140, 245, .16);
    --win: #221C33;
    --panel: #2A2340;
    --elev: #322A4B;
    --elev-2: #3B3157;
    --border: #3D3459;
    --border-soft: #332B4C;
    --text-0: #F2EAFB;
    --text-1: #A99CC2;
    --text-2: #786C93;
    --c1: #FF8FC0;
    --c2: #A98CF5;
    --track: #332B4C;
    --ok: #6FE0B6;
    --ok-glow: rgba(111, 224, 182, .6);
    --warn: #FFC078;
    --body-fill: #F6F1FF;
    --body-stroke: #4A3F6B;
    --blush: #FF9EC4;
    --ink: #3A2F4D;
    --glow: rgba(255, 143, 192, .38);
    --shadow: rgba(0, 0, 0, .40);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: linear-gradient(150deg, var(--page-1), var(--page-2));
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Helvetica Neue", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 30px 16px;
    -webkit-font-smoothing: antialiased;
    transition: background .4s ease;
  }

  /* ============ 二次元猫系少女背景（页面全幅） ============ */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: url("assets/bg-necogirl.jpg") center / cover no-repeat;
    opacity: .62;
    transition: opacity .4s ease;
  }
  [data-theme="night"] body::before {
    opacity: .14;
    filter: saturate(.85) hue-rotate(8deg);
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* ================= 窗口 ================= */
  .window {
    width: 420px;
    height: 600px;
    background: var(--win);
    border-radius: 22px;
    border: 2px solid var(--border);
    box-shadow: 0 26px 60px -14px var(--shadow),
                0 0 0 6px var(--border-soft);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    transition: background .4s ease, border-color .4s ease, box-shadow .4s ease;
  }

  /* 窗口内极淡的猫系少女底纹 */
  .window::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("assets/bg-necogirl.jpg") center 28% / cover no-repeat;
    opacity: .07;
    pointer-events: none;
    z-index: 0;
  }
  [data-theme="night"] .window::before { opacity: .05; }
  .window > .titlebar, .window > .content { position: relative; z-index: 1; }

  .titlebar {
    height: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 2px solid var(--border-soft);
    position: relative;
  }
  .traffic { display: flex; gap: 7px; }
  .traffic i {
    width: 11px; height: 11px; border-radius: 50%; display: block;
    border: 1.5px solid rgba(0, 0, 0, .06);
  }
  .traffic i:nth-child(1) { background: #FF8E8E; }
  .traffic i:nth-child(2) { background: #FFD08E; }
  .traffic i:nth-child(3) { background: #93E0A8; }
  .brand {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 74px; height: 16.2px;
    overflow: visible;
    user-select: none;
    /* 白色柔光把粉字托出 + 玫红小投影 */
    filter: drop-shadow(0 0 2px rgba(255, 255, 255, .85))
            drop-shadow(0 1.6px 1.2px rgba(163, 51, 115, .38));
  }

  .content {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 16px 20px 18px;
  }

  /* ================= 圆环 ================= */
  .dial-wrap {
    height: 196px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    position: relative;
  }

  .dial-hit {
    position: relative;
    width: 196px; height: 196px;
    display: grid; place-items: center;
    cursor: default;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
  }
  .dial-hit.clickable { cursor: pointer; }

  .dial {
    width: 196px; height: 196px;
    display: block;
    transition: filter .4s ease, transform .25s cubic-bezier(.3, 1.4, .5, 1);
  }
  .dial-hit.clickable .dial { filter: drop-shadow(0 0 12px var(--glow)); }
  .dial-hit.clickable:hover .dial { filter: drop-shadow(0 0 20px var(--glow)); }
  .dial-hit.clickable:active .dial { transform: scale(.965); }

  .ring-track {
    fill: none;
    stroke: var(--track);
    stroke-width: 9;
  }
  .ring-progress {
    fill: none;
    stroke: url(#gradRun);
    stroke-width: 9;
    stroke-linecap: round;
    transition: stroke .4s ease;
  }
  .ring-progress.done { stroke: url(#gradDone); }

  #gradRun stop:nth-child(1)  { stop-color: var(--c1); }
  #gradRun stop:nth-child(2)  { stop-color: var(--c2); }
  #gradDone stop:nth-child(1) { stop-color: #8FE8C6; }
  #gradDone stop:nth-child(2) { stop-color: #FFB3D1; }

  /* 外圈旋转虚线光环 —— 运行中 */
  .halo {
    fill: none;
    stroke: var(--c1);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 3 16;
    opacity: 0;
    transform-origin: 100px 100px;
    transition: opacity .4s ease;
  }
  .running .halo {
    opacity: .38;
    animation: haloSpin 7s linear infinite;
  }
  @keyframes haloSpin { to { transform: rotate(360deg); } }

  /* 待机呼吸 */
  .breathe {
    fill: none;
    stroke: var(--c1);
    stroke-width: 2;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
  }
  .idle .breathe { animation: breathePulse 3s ease-in-out infinite; }
  @keyframes breathePulse {
    0%   { opacity: 0;   transform: scale(.94); }
    50%  { opacity: .35; transform: scale(1); }
    100% { opacity: 0;   transform: scale(1.07); }
  }

  /* 进度头部小星星 */
  .ring-tip {
    opacity: 0;
    transition: opacity .3s ease;
    filter: drop-shadow(0 0 5px var(--c1));
  }
  .ring-tip.on { opacity: 1; }
  .ring-tip path { fill: #FFFFFF; }

  /* ================= 角色：界面右下角小猫娘 ================= */
  .side-girl {
    position: absolute;
    right: 6px;
    bottom: 6px;
    width: 94px;
    height: 132px;
    z-index: 5;
    pointer-events: none;
  }
  .side-girl img {
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: bottom center;
    display: none;
    -webkit-user-drag: none;
    user-select: none;
    filter: drop-shadow(0 5px 10px rgba(74, 63, 85, .22));
  }
  .side-girl img.on { display: block; }

  .idle .side-girl { animation: floaty 3.4s ease-in-out infinite; }
  .running .side-girl {
    width: 104px; height: 146px;
    animation: cheerJump .64s ease-in-out infinite;
  }
  .done .side-girl { animation: cheer .75s cubic-bezier(.2, 1.6, .4, 1); }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  /* 清理中：持续蹦跳打气 */
  @keyframes cheerJump {
    0%, 100% { transform: translateY(0) rotate(-3.5deg); }
    50%      { transform: translateY(-10px) rotate(3.5deg); }
  }
  @keyframes cheer {
    0%   { transform: scale(.7) translateY(6px); }
    55%  { transform: scale(1.14) translateY(-9px); }
    100% { transform: scale(1) translateY(0); }
  }

  /* ================= 圆环中心文字 ================= */
  .start-label {
    /* 仅「开始」二字使用圆体，全局其余文字走苹方 */
    font-family: "SF Pro Rounded", "SweepRound", sans-serif;
    font-size: 31px;
    font-weight: 700;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--text-0);
    user-select: none;
    white-space: nowrap;
    animation: popIn .35s cubic-bezier(.3, 1.5, .5, 1);
    transition: transform .25s cubic-bezier(.3, 1.4, .5, 1), text-shadow .25s ease;
  }
  .dial-hit.clickable:hover ~ .mascot .start-label {
    transform: scale(1.09);
    text-shadow: 0 0 16px var(--glow);
  }

  /* 完成态：圆环中心即「完成」按钮（与「开始」同款圆体排版，配色转绿） */
  .done-label {
    font-family: "SF Pro Rounded", "SweepRound", sans-serif;
    font-size: 31px;
    font-weight: 700;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--ok);
    user-select: none;
    white-space: nowrap;
    animation: popIn .35s cubic-bezier(.3, 1.5, .5, 1);
    transition: transform .25s cubic-bezier(.3, 1.4, .5, 1), text-shadow .25s ease;
  }
  .done .dial-hit.clickable:hover ~ .mascot .done-label {
    transform: scale(1.09);
    text-shadow: 0 0 18px var(--ok-glow);
  }

  /* ================= 角色层容器 ================= */
  .mascot {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #centerSlot {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }

  /* ================= 角色文字层样式占位结束 ================= */

  /* 中心百分比 */
  .pct {
    font-family: "SweepRound", "SF Pro Rounded", sans-serif;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--text-0);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    animation: popIn .35s cubic-bezier(.3, 1.5, .5, 1);
  }
  .pct .unit {
    font-size: 16px; font-weight: 700;
    color: var(--text-2); margin-left: 2px;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.8); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 完成时撒星星 */
  .sparks { position: absolute; inset: 0; pointer-events: none; }
  .spark {
    position: absolute;
    left: 50%; top: 50%;
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    animation: sparkFly .95s cubic-bezier(.15, .8, .3, 1) forwards;
  }
  .spark svg { display: block; width: 100%; height: 100%; }
  @keyframes sparkFly {
    0%   { transform: translate(0, 0) scale(.1) rotate(0deg); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity: 0; }
  }

  /* ================= 对话气泡 ================= */
  .bubble-row {
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 6px;
  }
  .bubble {
    position: relative;
    display: inline-block;
    max-width: 100%;
    background: var(--elev);
    border: 2px solid var(--border);
    border-radius: 15px;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-0);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    animation: bubbleIn .32s cubic-bezier(.3, 1.4, .5, 1);
  }
  .bubble::before {
    content: '';
    position: absolute;
    top: -6.5px; left: 50%;
    width: 10px; height: 10px;
    margin-left: -5px;
    background: var(--elev);
    border-left: 2px solid var(--border);
    border-top: 2px solid var(--border);
    border-radius: 2px 0 0 0;
    transform: rotate(45deg);
  }
  .bubble .sec-name { color: var(--c1); }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(5px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .released {
    height: 16px;
    flex-shrink: 0;
    margin-top: 3px;
    text-align: center;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .released.on { opacity: 1; }

  /* ================= 面板 ================= */
  .panel {
    flex: 1;
    min-height: 0;
    margin-top: 12px;
    border-radius: 18px;
    background: var(--panel);
    border: 2px solid var(--border-soft);
    position: relative;
    overflow: hidden;
  }

  .view {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity .32s ease;
  }
  .view.active { opacity: 1; visibility: visible; }

  /* 待机提示 */
  .hint {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 9px;
    padding: 2px 16px;
  }
  .hint-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-2);
    letter-spacing: .06em;
  }
  .hint-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px;
    font-weight: 600;
    padding: 3.5px 10px;
    border-radius: 999px;
    background: var(--elev);
    color: var(--text-1);
    border: 1.5px solid var(--border);
  }
  .hint-note {
    font-size: 11px;
    color: var(--text-2);
    line-height: 1.7;
    font-weight: 500;
  }

  /* 日志：右侧给右下角的小猫娘让出空间 */
  .log {
    height: 100%;
    overflow-y: auto;
    padding: 10px 102px 14px 13px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .log::-webkit-scrollbar { width: 5px; }
  .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .log::-webkit-scrollbar-track { background: transparent; }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 25px;
    font-size: 12px;
    font-weight: 500;
    animation: rowIn .3s cubic-bezier(.2, .9, .3, 1);
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(7px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .row.sec {
    height: 28px;
    margin-top: 5px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-2);
    letter-spacing: .05em;
  }
  .row.sec:first-child { margin-top: 0; }

  .mk {
    width: 14px;
    flex-shrink: 0;
    text-align: center;
    font-size: 11px;
    line-height: 1;
    font-weight: 700;
  }
  .mk.ok   { color: var(--ok); }
  .mk.sec  { color: var(--c1); }
  .mk.skip { color: var(--warn); }
  .mk.man  { color: var(--text-2); }

  .label {
    flex: 1;
    color: var(--text-0);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row.sec .label, .row.dim .label { color: var(--text-2); }

  .size {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
  }
  .note {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
  }

  /* ================= 结果 ================= */
  .result {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 18px;
  }
  .res-cap {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-2);
    letter-spacing: .08em;
  }
  .res-big {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -.025em;
    color: var(--text-0);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    margin-top: 1px;
    animation: riseIn .5s .08s cubic-bezier(.2, 1.2, .3, 1) backwards;
  }
  .res-big .unit {
    font-size: 18px; font-weight: 700;
    color: var(--text-2); margin-left: 3px;
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(11px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .res-stats {
    display: flex;
    align-items: center;
    gap: 26px;
    margin-top: 12px;
  }
  .stat { text-align: center; }
  .stat-num {
    font-size: 19px; font-weight: 800;
    color: var(--text-0);
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
  }
  .stat-cap {
    font-size: 10.5px; font-weight: 600;
    color: var(--text-2);
    margin-top: 2px; letter-spacing: .05em;
  }
  .stat-div {
    width: 2px; height: 26px;
    background: var(--border);
    border-radius: 1px;
  }

  .res-disk {
    margin-top: 12px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 6px;
  }
  .res-disk .arrow { color: var(--text-2); }
  .res-disk .after { color: var(--ok); font-weight: 800; }

  /* ================= 按钮 ================= */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 13px;
    height: 38px;
    flex-shrink: 0;
    width: calc(100% - 100px);   /* 右侧留给右下角的小猫娘 */
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease;
  }
  .actions.on { opacity: 1; visibility: visible; }

  .btn {
    flex: 1;
    border-radius: 13px;
    border: 2px solid var(--border);
    background: var(--elev);
    color: var(--text-0);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background .18s ease, transform .1s ease, box-shadow .18s ease;
  }
  .btn:hover { background: var(--elev-2); }
  .btn:active { transform: scale(.966); }

  .btn.primary {
    background: linear-gradient(135deg, var(--c1), var(--c2));
    border-color: transparent;
    color: #FFFFFF;
    box-shadow: 0 5px 14px -3px var(--glow);
  }
  .btn.primary:hover { filter: brightness(1.06); }

  /* ================= 控制条 ================= */
  .controls {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 600; color: var(--text-1);
  }
  .seg {
    display: flex;
    background: var(--win);
    border: 2px solid var(--border);
    border-radius: 13px;
    padding: 3px; gap: 3px;
  }
  .seg button {
    border: none; background: transparent;
    color: var(--text-1);
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    padding: 5px 11px; border-radius: 10px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .seg button:hover { color: var(--text-0); }
  .seg button.on {
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #FFFFFF;
  }
  .controls .sep { width: 2px; height: 16px; background: var(--border); border-radius: 1px; }

  .footnote {
    font-size: 11px;
    color: var(--text-0);
    text-align: center;
    line-height: 1.7;
    max-width: 430px;
    font-weight: 600;
    text-shadow: 0 1px 6px rgba(255, 255, 255, .9), 0 0 14px rgba(255, 255, 255, .7);
  }
  [data-theme="night"] .footnote { color: var(--text-1); text-shadow: none; }
</style>
</head>
<body>

<div class="stage">
  <div class="window idle" id="win">
    <div class="titlebar">
      <div class="traffic"><i></i><i></i><i></i></div>
      <svg class="brand" viewBox="0 0 505 100" role="img" aria-label="SWEEP">
        <defs>
          <g id="brandGlyphs">
            <path d="M 67 32 C 67 18, 17 18, 17 35 C 17 51, 67 45, 67 62 C 67 79, 17 79, 17 64"/>
            <path d="M 115 22 L 115 60 A 20 20 0 0 0 155 60 L 155 22"/>
            <path d="M 155 22 L 155 60 A 20 20 0 0 0 195 60 L 195 22"/>
            <path d="M 243 22 L 243 78 M 243 22 L 289 22 M 243 50 L 279 50 M 243 78 L 289 78"/>
            <path d="M 337 22 L 337 78 M 337 22 L 383 22 M 337 50 L 373 50 M 337 78 L 383 78"/>
            <path d="M 431 78 L 431 22 L 469 22 A 19 19 0 0 1 469 60 L 431 60"/>
          </g>
          <mask id="brandHollow" maskUnits="userSpaceOnUse" x="-40" y="-60" width="580" height="220">
            <rect x="-40" y="-60" width="580" height="220" fill="#fff"/>
            <use href="#brandGlyphs" fill="none" stroke="#000" stroke-width="20"
                 stroke-linecap="round" stroke-linejoin="round"/>
          </mask>
          <linearGradient id="brandPink" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="94">
            <stop offset="0"   stop-color="#ffd3ea"/>
            <stop offset=".42" stop-color="#ff9ecb"/>
            <stop offset="1"   stop-color="#f2549b"/>
          </linearGradient>
        </defs>
        <use href="#brandGlyphs" mask="url(#brandHollow)" fill="none"
             stroke="url(#brandPink)" stroke-width="34"
             stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="content">
      <!-- 圆环 + 角色 -->
      <div class="dial-wrap">
        <div class="dial-hit clickable" id="dialHit" role="button" tabindex="0" aria-label="开始清理">
          <svg class="dial" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="gradRun" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"/><stop offset="100%"/>
              </linearGradient>
              <linearGradient id="gradDone" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"/><stop offset="100%"/>
              </linearGradient>
            </defs>

            <circle class="breathe" cx="100" cy="100" r="88"/>
            <circle class="halo" cx="100" cy="100" r="96"/>
            <circle class="ring-track" cx="100" cy="100" r="88"/>
            <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="88"
                    transform="rotate(-90 100 100)"/>

            <!-- 进度头部：四角星 -->
            <g class="ring-tip" id="ringTip">
              <path d="M0,-8 L2.2,-2.2 L8,0 L2.2,2.2 L0,8 L-2.2,2.2 L-8,0 L-2.2,-2.2 Z"/>
            </g>
          </svg>
        </div>

        <!-- 圆环中心文字 -->
        <div class="mascot">
          <div id="centerSlot"></div>
        </div>

        <div class="sparks" id="sparks"></div>
      </div>

      <!-- 对话气泡 -->
      <div class="bubble-row">
        <div class="bubble" id="bubble">点我，开始清扫吧！</div>
      </div>
      <div class="released" id="released"></div>

      <!-- 面板 -->
      <div class="panel">
        <div class="view active" id="viewHint">
          <div class="hint">
            <div class="hint-title">我会帮你扫干净这些地方</div>
            <div class="hint-list">
              <span class="chip">应用缓存</span>
              <span class="chip">系统日志</span>
              <span class="chip">开发者工具</span>
              <span class="chip">浏览器</span>
              <span class="chip">应用残留</span>
              <span class="chip">大文件</span>
            </div>
            <div class="hint-note">
              全部在本机完成，不联网。<br>
              只管用户级内容，<b>不会向你要管理员密码</b>。
            </div>
          </div>
        </div>

        <div class="view" id="viewLog">
          <div class="log" id="log"></div>
        </div>

        <div class="view" id="viewResult">
          <div class="result">
            <div class="res-cap">这次帮你腾出了</div>
            <div class="res-big" id="resBig">0<span class="unit">MB</span></div>
            <div class="res-stats">
              <div class="stat">
                <div class="stat-num" id="resItems">18</div>
                <div class="stat-cap">清理项</div>
              </div>
              <div class="stat-div"></div>
              <div class="stat">
                <div class="stat-num" id="resCats">4</div>
                <div class="stat-cap">分类</div>
              </div>
            </div>
            <div class="res-disk">
              <span>磁盘可用</span>
              <span>184.41 GB</span>
              <span class="arrow">→</span>
              <span class="after" id="resDiskAfter">184.68 GB</span>
            </div>
          </div>
        </div>

        <div class="view" id="viewDetail">
          <div class="log" id="detail"></div>
        </div>
      </div>

      <div class="actions" id="actions">
        <button class="btn" id="btnDetail">查看详情</button>
      </div>
    </div>

    <!-- 界面右下角的小猫娘（窗口级定位） -->
    <div class="side-girl">
      <img id="poseIdle"  class="on" src="assets/mascot-idle.png"  alt="" draggable="false">
      <img id="poseSweep" src="assets/mascot-sweep.png" alt="" draggable="false">
      <img id="poseCheer" src="assets/mascot-cheer.png" alt="" draggable="false">
      <img id="poseDone"  src="assets/mascot-done.png"  alt="" draggable="false">
    </div>
  </div>

  <div class="controls">
    <div class="seg">
      <button data-speed="demo" class="on">演示 15s</button>
      <button data-speed="real">真实 50s</button>
    </div>
    <div class="sep"></div>
    <div class="seg">
      <button data-theme="sakura" class="on">樱花</button>
      <button data-theme="mint">薄荷</button>
      <button data-theme="night">夜空</button>
    </div>
  </div>

  <div class="footnote">
    猫系少女方案：AI 生成原创立绘与背景 · 圆体字内嵌（开源庆科黄油体子集）· 进度数据取自本机真实扫描。
  </div>
</div>

<script>
/* ============================================================
   真实清理数据 —— 与极简版同一来源（本机 dry-run 实测）
   ============================================================ */
const SECTIONS = [
  { name: '用户基础项', weight: 12, items: [
    { t: '用户应用缓存', size: '78 KB', kind: 'cleaned' },
    { t: '用户应用日志', size: '4 KB',  kind: 'cleaned' },
  ]},
  { name: '应用缓存', weight: 10, items: [
    { t: 'Geod 临时文件', size: '0 B', kind: 'cleaned' },
  ]},
  { name: '浏览器', weight: 5, items: [
    { t: 'Dia 应用支持缓存', kind: 'skipped', note: 'Dia 正在运行' },
  ]},
  { name: '云服务与办公', weight: 3, items: [
    { t: '无需清理', kind: 'empty' },
  ]},
  { name: '开发者工具', weight: 38, items: [
    { t: 'npm 缓存',       kind: 'cleaned' },
    { t: 'npm 日志',       size: '1 KB', kind: 'cleaned' },
    { t: 'Corepack 缓存',  kind: 'cleaned' },
    { t: 'pip 缓存',       kind: 'cleaned' },
    { t: 'uv 缓存',        size: '48.0 MB',  kind: 'cleaned' },
    { t: 'Oh My Zsh 缓存', size: '1 KB',     kind: 'cleaned' },
    { t: 'Clang 模块缓存', size: '223.9 MB', kind: 'cleaned' },
    { t: '项目构建缓存',   kind: 'skipped', note: '3 个根目录扫描过慢' },
    { t: 'Codex 运行时',   kind: 'manual',  note: '需手动确认' },
  ]},
  { name: '应用与实用工具', weight: 6, items: [
    { t: 'Zsh 补全缓存', size: '169 KB', kind: 'cleaned' },
  ]},
  { name: '虚拟化',       weight: 3, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '应用支持文件', weight: 7, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '应用残留',     weight: 8, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: 'Apple 芯片更新', weight: 2, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '设备备份与固件', weight: 2, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '时间机器',     weight: 2, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '大文件',       weight: 2, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '项目产物',     weight: 0, items: [
    { t: '构建产物', kind: 'skipped', note: '需使用 purge 命令' },
  ]},
];

const RELEASE_DISK_AFTER = '184.68 GB';
const ITEMS_CLEANED = 18;
const CATEGORIES = 4;

/* 角色俏皮话：进入模块时轮换 */
const QUIPS = {
  '用户基础项':       '先从缓存开始扫～',
  '应用缓存':         '这边有点灰，扫掉！',
  '浏览器':           '浏览器角落也看看～',
  '云服务与办公':     '嗯…这里挺干净的',
  '开发者工具':       '重头戏来了，加油！',
  '应用与实用工具':   '小角落也不放过～',
  '虚拟化':           '翻一翻，没东西～',
  '应用支持文件':     '检查一下…干净！',
  '应用残留':         '找找有没有留下的垃圾～',
  'Apple 芯片更新':   '顺手清一下～',
  '设备备份与固件':   '这里不乱，放心',
  '时间机器':         '备份区不能乱动哦',
  '大文件':           '巡视一圈…没发现～',
  '项目产物':         '这个要你自己决定啦',
};

const DURATIONS = { demo: 15000, real: 50000 };
const MIN_SECTION_MS = 150;

/* ============ DOM ============ */
const $ = id => document.getElementById(id);
const win = $('win'), dialHit = $('dialHit'), centerSlot = $('centerSlot');
const ringProgress = $('ringProgress'), ringTip = $('ringTip');
const bubbleEl = $('bubble'), releasedEl = $('released');
const logEl = $('log'), detailEl = $('detail'), actionsEl = $('actions');
const sparksEl = $('sparks');
const views = {
  hint: $('viewHint'), log: $('viewLog'),
  result: $('viewResult'), detail: $('viewDetail'),
};

const R = 88;
const CIRC = 2 * Math.PI * R;
ringProgress.style.strokeDasharray = CIRC;
ringProgress.style.strokeDashoffset = CIRC;

/* ============ 状态 ============ */
let phase = 'idle';
let displayPct = 0, targetPct = 0;
let releasedKB = 0;
let runToken = 0;
let rafId = null;
let totalDuration = DURATIONS.demo;
let detailOpen = false;

/* ============ 工具 ============ */
function sleep(ms, token) {
  return new Promise((res, rej) => {
    setTimeout(() => token === runToken ? res() : rej(new Error('cancelled')), ms);
  });
}
function parseKB(s) {
  if (!s) return 0;
  const m = String(s).match(/([\d.]+)\s*(B|KB|MB|GB)/i);
  if (!m) return 0;
  const v = parseFloat(m[1]), u = m[2].toUpperCase();
  if (u === 'GB') return v * 1024 * 1024;
  if (u === 'MB') return v * 1024;
  if (u === 'KB') return v;
  return v / 1024;
}
function fmtMB(kb) {
  const mb = kb / 1024;
  return mb >= 1000 ? (mb / 1024).toFixed(2) + ' GB' : mb.toFixed(1) + ' MB';
}
function showView(name) {
  Object.entries(views).forEach(([k, el]) => el.classList.toggle('active', k === name));
}
function setBubble(html) {
  if (bubbleEl.innerHTML === html) return;
  bubbleEl.innerHTML = html;
  // 重放弹出动画，让每次换词都“弹”一下
  bubbleEl.style.animation = 'none';
  void bubbleEl.offsetWidth;
  bubbleEl.style.animation = '';
}

function setPose(p) {
  const map = { idle: 'poseIdle', sweep: 'poseSweep', cheer: 'poseCheer', done: 'poseDone' };
  Object.entries(map).forEach(([k, id]) => $(id).classList.toggle('on', k === p));
}

function mountStart() {
  centerSlot.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'start-label'; d.id = 'startLabel';
  d.textContent = '开始';
  centerSlot.appendChild(d);
}

function mountDone() {
  centerSlot.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'done-label'; d.id = 'doneLabel';
  d.textContent = '完成';
  centerSlot.appendChild(d);
}

/* ============ 圆环渲染 ============ */
function renderDial() {
  const pct = Math.max(0, Math.min(100, displayPct));
  ringProgress.style.strokeDashoffset = CIRC * (1 - pct / 100);

  if (phase === 'running' && pct > 0.8 && pct < 99.6) {
    const ang = (-90 + 360 * pct / 100) * Math.PI / 180;
    const x = 100 + R * Math.cos(ang);
    const y = 100 + R * Math.sin(ang);
    ringTip.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
    ringTip.classList.add('on');
  } else {
    ringTip.classList.remove('on');
  }

  const n = $('pctNum');
  if (n && phase === 'running') n.firstChild.nodeValue = Math.round(pct);
}

function mountPct() {
  centerSlot.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'pct'; d.id = 'pctNum';
  d.appendChild(document.createTextNode('0'));
  const u = document.createElement('span');
  u.className = 'unit'; u.textContent = '%';
  d.appendChild(u);
  centerSlot.appendChild(d);
}

/* ============ 动画循环（时间基指数收敛） ============ */
let lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  const diff = targetPct - displayPct;
  if (Math.abs(diff) > 0.02) {
    displayPct += diff * (1 - Math.exp(-dt * 7));
    renderDial();
  } else if (displayPct !== targetPct) {
    displayPct = targetPct;
    renderDial();
  }
  rafId = requestAnimationFrame(tick);
}

/* ============ 日志 ============ */
const MARK = {
  cleaned: { cls: 'ok',   ch: '✓' },
  skipped: { cls: 'skip', ch: '○' },
  manual:  { cls: 'man',  ch: '·' },
  empty:   { cls: 'man',  ch: '✓' },
};

function buildSectionRow(name) {
  const row = document.createElement('div');
  row.className = 'row sec';
  const mk = document.createElement('span');
  mk.className = 'mk sec'; mk.textContent = '◆';
  const lb = document.createElement('span');
  lb.className = 'label'; lb.textContent = name;
  row.append(mk, lb);
  return row;
}

function buildItemRow(item) {
  const row = document.createElement('div');
  row.className = 'row' + (item.kind === 'empty' ? ' dim' : '');
  const m = MARK[item.kind] || MARK.cleaned;
  const mk = document.createElement('span');
  mk.className = 'mk ' + m.cls; mk.textContent = m.ch;
  const lb = document.createElement('span');
  lb.className = 'label';
  lb.textContent = item.kind === 'empty' ? '无需清理' : item.t;
  row.append(mk, lb);
  if (item.size) {
    const sz = document.createElement('span');
    sz.className = 'size'; sz.textContent = item.size;
    row.appendChild(sz);
  } else if (item.note) {
    const nt = document.createElement('span');
    nt.className = 'note'; nt.textContent = item.note;
    row.appendChild(nt);
  }
  return row;
}

function appendSection(name) {
  logEl.appendChild(buildSectionRow(name));
  logEl.scrollTop = logEl.scrollHeight;
}
function appendItem(item) {
  logEl.appendChild(buildItemRow(item));
  logEl.scrollTop = logEl.scrollHeight;
}

/* ============ 撒星星 ============ */
function burstSparks() {
  sparksEl.innerHTML = '';
  const colors = ['#FFB3D1', '#FFD98E', '#A9D9FF', '#C9A7F5', '#8FE8C6'];
  const N = 10;
  for (let i = 0; i < N; i++) {
    const ang = (i / N) * Math.PI * 2 + (Math.random() - .5) * .4;
    const dist = 82 + Math.random() * 34;
    const el = document.createElement('div');
    el.className = 'spark';
    el.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    el.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
    el.style.setProperty('--rot', (Math.random() * 300 - 150).toFixed(0) + 'deg');
    el.style.animationDelay = (i * 26) + 'ms';
    const c = colors[i % colors.length];
    el.innerHTML =
      `<svg viewBox="0 0 24 24"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z" fill="${c}"/></svg>`;
    sparksEl.appendChild(el);
  }
  setTimeout(() => { sparksEl.innerHTML = ''; }, 1600);
}

/* ============ 主流程 ============ */
function calcDurations() {
  const nonBase = totalDuration - MIN_SECTION_MS * SECTIONS.length;
  SECTIONS.forEach(s => { s.duration = MIN_SECTION_MS + nonBase * s.weight / 100; });
}

async function run(token) {
  phase = 'running';
  calcDurations();

  win.classList.remove('idle');
  win.classList.add('running');
  setPose('cheer');
  dialHit.classList.remove('clickable');
  mountPct();
  showView('log');
  logEl.innerHTML = '';
  releasedEl.classList.add('on');

  try {
    await sleep(260, token);
    setBubble('开工啦～');

    for (const sec of SECTIONS) {
      if (token !== runToken) return;

      setBubble(`${QUIPS[sec.name] || '清扫中…'} <span class="sec-name">${sec.name}</span>`);
      appendSection(sec.name);

      const per = sec.duration / sec.items.length;
      for (const item of sec.items) {
        await sleep(per * 0.45, token);
        if (token !== runToken) return;

        appendItem(item);
        targetPct = Math.min(100, targetPct + sec.weight / sec.items.length);

        if (item.kind === 'cleaned' && item.size) {
          releasedKB += parseKB(item.size);
          releasedEl.textContent = `已经帮你腾出 ${fmtMB(releasedKB)}`;
        }
        await sleep(per * 0.55, token);
      }
    }

    if (token !== runToken) return;
    targetPct = 100;
    await sleep(520, token);
    finish();
  } catch (e) { /* cancelled */ }
}

function finish() {
  phase = 'done';
  win.classList.remove('running');
  win.classList.add('done');

  centerSlot.innerHTML = '';
  setPose('done');
  mountDone();
  ringProgress.classList.add('done');
  ringTip.classList.remove('on');
  dialHit.classList.add('clickable');   // 完成态：圆环中心「完成」可点击收工

  setBubble('都干净啦，点完成收工');
  releasedEl.classList.remove('on');
  burstSparks();

  const mb = releasedKB / 1024;
  $('resBig').innerHTML = mb >= 1000
    ? `${(mb / 1024).toFixed(2)}<span class="unit">GB</span>`
    : `${mb.toFixed(1)}<span class="unit">MB</span>`;
  $('resItems').textContent = ITEMS_CLEANED;
  $('resCats').textContent = CATEGORIES;
  $('resDiskAfter').textContent = RELEASE_DISK_AFTER;

  logEl.scrollTop = logEl.scrollHeight;
  renderDetail();

  const doneToken = runToken;              // 面板延迟显示的守卫：若期间被 reset 打断则跳过
  setTimeout(() => {
    if (doneToken !== runToken || phase !== 'done') return;
    showView('result');
    actionsEl.classList.add('on');
  }, 520);
}

/* ============ 详情 ============ */
function renderDetail() {
  detailEl.innerHTML = '';
  SECTIONS.forEach(sec => {
    detailEl.appendChild(buildSectionRow(sec.name));
    sec.items.forEach(it => detailEl.appendChild(buildItemRow(it)));
  });
}

/* ============ 重置 ============ */
function reset() {
  runToken++;
  phase = 'idle';
  displayPct = 0; targetPct = 0; releasedKB = 0;
  detailOpen = false;

  win.classList.add('idle');
  win.classList.remove('running', 'done');
  dialHit.classList.add('clickable');
  ringProgress.classList.remove('done');
  ringTip.classList.remove('on');
  sparksEl.innerHTML = '';

  centerSlot.innerHTML = '';
  setPose('idle');
  mountStart();
  setBubble('点我，开始清扫吧！');
  releasedEl.classList.remove('on');
  releasedEl.textContent = '';
  actionsEl.classList.remove('on');
  logEl.innerHTML = '';
  $('btnDetail').textContent = '查看详情';

  showView('hint');
  renderDial();
}

/* ============ 交互 ============ */
function start() {
  if (phase !== 'idle') return;
  reset();
  runToken++;
  run(runToken);
}

dialHit.addEventListener('click', () => {
  if (phase === 'done') { reset(); return; }   // 完成态：点中心的「完成」收工
  start();
});
dialHit.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (phase === 'done') reset(); else start();
  }
});

$('btnDetail').addEventListener('click', () => {
  detailOpen = !detailOpen;
  $('btnDetail').textContent = detailOpen ? '返回结果' : '查看详情';
  showView(detailOpen ? 'detail' : 'result');
  if (detailOpen) detailEl.scrollTop = 0;
});

document.querySelectorAll('[data-speed]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    totalDuration = DURATIONS[btn.dataset.speed];
    if (phase !== 'idle') reset();
  });
});

document.querySelectorAll('[data-theme]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    document.documentElement.dataset.theme = btn.dataset.theme;
  });
});

/* ============ 启动 ============ */
ringProgress.style.strokeDashoffset = CIRC;
mountStart();
rafId = requestAnimationFrame(tick);
</script>
</body>
</html>
