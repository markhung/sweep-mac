<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweep · 交互原型</title>
<style>
  /* ============ 主题变量 ============ */
  :root, [data-theme="dark"] {
    --bg-page-1: #0b0d11;
    --bg-page-2: #050608;
    --bg-win: #14161b;
    --bg-panel: #1a1d23;
    --bg-elev: #22262e;
    --border: #262a33;
    --border-soft: #1f232a;
    --text-0: #e7e9ed;
    --text-1: #8b929e;
    --text-2: #5a616c;
    --accent-1: #22d3ee;
    --accent-2: #3b82f6;
    --ok: #34d399;
    --ok-dim: #10b981;
    --warn: #fbbf24;
    --track: #232730;
    --glow: rgba(34, 211, 238, .35);
  }
  [data-theme="light"] {
    --bg-page-1: #f2f4f8;
    --bg-page-2: #e6e9ef;
    --bg-win: #ffffff;
    --bg-panel: #f7f8fa;
    --bg-elev: #eef0f4;
    --border: #e2e5eb;
    --border-soft: #eaecf1;
    --text-0: #16181d;
    --text-1: #646c7a;
    --text-2: #9aa1ad;
    --accent-1: #06b6d4;
    --accent-2: #2563eb;
    --ok: #10b981;
    --ok-dim: #059669;
    --warn: #d97706;
    --track: #e8eaef;
    --glow: rgba(6, 182, 212, .28);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background:
      radial-gradient(900px 600px at 50% -10%, var(--bg-page-1), var(--bg-page-2) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
                 "Helvetica Neue", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
    transition: background .35s ease;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* ============ 窗口 ============ */
  .window {
    width: 420px;
    height: 600px;
    background: var(--bg-win);
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 30px 70px -12px rgba(0, 0, 0, .55),
                0 0 0 1px rgba(255, 255, 255, .03) inset;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .35s ease, border-color .35s ease;
  }

  .titlebar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--border-soft);
    position: relative;
  }
  .traffic { display: flex; gap: 8px; }
  .traffic i {
    width: 11px; height: 11px; border-radius: 50%;
    display: block;
  }
  .traffic i:nth-child(1) { background: #ff5f57; }
  .traffic i:nth-child(2) { background: #febc2e; }
  .traffic i:nth-child(3) { background: #28c840; }
  .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 600; letter-spacing: .01em;
    color: var(--text-0);
  }

  .content {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 18px 20px 20px;
  }

  /* ============ 圆环 ============ */
  .dial-wrap {
    height: 202px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    position: relative;
  }

  .dial-hit {
    position: relative;
    width: 200px;
    height: 200px;
    display: grid;
    place-items: center;
    cursor: default;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
  }
  .dial-hit.clickable { cursor: pointer; }

  .dial { width: 200px; height: 200px; display: block; transition: filter .4s ease; }

  /* SVG 渐变的 stop-color 必须走 CSS，不能写进 presentation attribute */
  #gradRun stop:nth-child(1)  { stop-color: var(--accent-1); }
  #gradRun stop:nth-child(2)  { stop-color: var(--accent-2); }
  #gradDone stop:nth-child(1) { stop-color: #34d399; }
  #gradDone stop:nth-child(2) { stop-color: #10b981; }

  .dial-hit.clickable .dial { filter: drop-shadow(0 0 14px var(--glow)); }
  .dial-hit.clickable:hover .dial { filter: drop-shadow(0 0 22px var(--glow)); }

  .ring-track {
    fill: none;
    stroke: var(--track);
    stroke-width: 8;
  }
  .ring-progress {
    fill: none;
    stroke: url(#gradRun);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke .45s ease;
  }
  .ring-progress.done { stroke: url(#gradDone); }

  /* 进度头部光点 */
  .ring-tip {
    fill: #ffffff;
    opacity: 0;
    transition: opacity .3s ease;
    filter: drop-shadow(0 0 6px var(--accent-1));
  }
  .ring-tip.on { opacity: .95; }

  /* 待机呼吸 */
  .breathe {
    fill: none;
    stroke: var(--accent-1);
    stroke-width: 1.5;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
  }
  .idle .breathe {
    animation: breathePulse 3.2s ease-in-out infinite;
  }
  @keyframes breathePulse {
    0%   { opacity: 0;    transform: scale(.92); }
    50%  { opacity: .22;  transform: scale(1);   }
    100% { opacity: 0;    transform: scale(1.06); }
  }

  .dial-center {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    text-align: center;
  }

  .pct {
    font-size: 46px;
    font-weight: 600;
    letter-spacing: -.03em;
    color: var(--text-0);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .pct .unit {
    font-size: 20px;
    font-weight: 500;
    color: var(--text-2);
    margin-left: 3px;
    letter-spacing: 0;
  }

  .idle-label {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-0);
    letter-spacing: .06em;
  }

  .check {
    width: 62px; height: 62px;
    animation: checkPop .5s cubic-bezier(.2, 1.5, .4, 1);
  }
  .check path {
    stroke: var(--ok);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: drawCheck .45s .12s cubic-bezier(.4, 0, .2, 1) forwards;
  }
  @keyframes checkPop {
    0%   { transform: scale(.5); opacity: 0; }
    100% { transform: scale(1);  opacity: 1; }
  }
  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  /* ============ 状态行 ============ */
  .status {
    height: 20px;
    flex-shrink: 0;
    text-align: center;
    font-size: 13px;
    color: var(--text-1);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .status .sec-name { color: var(--text-0); font-weight: 500; }

  .released {
    height: 18px;
    flex-shrink: 0;
    margin-top: 3px;
    text-align: center;
    font-size: 12px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .released.on { opacity: 1; }

  /* ============ 面板 ============ */
  .panel {
    flex: 1;
    min-height: 0;
    margin-top: 15px;
    border-radius: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    position: relative;
    overflow: hidden;
  }

  .view {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity .32s ease;
  }
  .view.active { opacity: 1; visibility: visible; }

  /* 待机提示 */
  .hint {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 11px;
    padding: 4px 18px;
  }
  .hint-title {
    font-size: 11px;
    color: var(--text-2);
    letter-spacing: .07em;
    font-weight: 500;
  }
  .hint-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bg-elev);
    color: var(--text-1);
    border: 1px solid var(--border-soft);
  }
  .hint-note {
    font-size: 11px;
    color: var(--text-2);
    line-height: 1.65;
    margin-top: 2px;
  }

  /* 日志 */
  .log {
    height: 100%;
    overflow-y: auto;
    padding: 9px 13px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .log::-webkit-scrollbar { width: 5px; }
  .log::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  .log::-webkit-scrollbar-track { background: transparent; }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 25px;
    font-size: 12px;
    animation: rowIn .28s cubic-bezier(.2, .8, .3, 1);
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .row.sec {
    height: 29px;
    margin-top: 5px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
    letter-spacing: .04em;
  }
  .row.sec:first-child { margin-top: 0; }

  .mk {
    width: 13px;
    flex-shrink: 0;
    text-align: center;
    font-size: 11px;
    line-height: 1;
  }
  .mk.ok    { color: var(--ok); }
  .mk.sec   { color: var(--text-2); }
  .mk.skip  { color: var(--warn); }
  .mk.man   { color: var(--text-2); }

  .label {
    flex: 1;
    color: var(--text-0);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row.sec .label { color: var(--text-2); }
  .row.dim .label { color: var(--text-2); }

  .size {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
  }
  .note {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-2);
  }

  /* ============ 结果 ============ */
  .result {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 10px 20px;
  }
  .res-cap {
    font-size: 11px;
    color: var(--text-2);
    letter-spacing: .07em;
  }
  .res-big {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -.025em;
    color: var(--text-0);
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
    animation: riseIn .45s .1s cubic-bezier(.2, .9, .3, 1) backwards;
  }
  .res-big .unit {
    font-size: 19px;
    font-weight: 500;
    color: var(--text-2);
    margin-left: 3px;
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .res-stats {
    display: flex;
    gap: 30px;
    margin-top: 12px;
  }
  .stat { text-align: center; }
  .stat-num {
    font-size: 19px;
    font-weight: 600;
    color: var(--text-0);
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
  }
  .stat-cap {
    font-size: 10.5px;
    color: var(--text-2);
    margin-top: 2px;
    letter-spacing: .05em;
  }
  .stat-div {
    width: 1px;
    background: var(--border);
    margin: 3px 0;
  }

  .res-disk {
    margin-top: 13px;
    font-size: 11.5px;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .res-disk .arrow { color: var(--text-2); }
  .res-disk .after { color: var(--ok); font-weight: 500; }

  /* ============ 按钮 ============ */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    height: 36px;
    flex-shrink: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease;
  }
  .actions.on { opacity: 1; visibility: visible; }

  .btn {
    flex: 1;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text-0);
    font-size: 12.5px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, transform .1s ease;
  }
  .btn:hover { background: var(--bg-elev); }
  .btn:active { transform: scale(.978); }

  .btn.primary {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border: none;
    color: #fff;
  }
  .btn.primary:hover { filter: brightness(1.08); }

  /* ============ 窗口外控制条 ============ */
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-1);
  }

  .seg {
    display: flex;
    background: var(--bg-win);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    border: none;
    background: transparent;
    color: var(--text-1);
    font-family: inherit;
    font-size: 11.5px;
    padding: 5px 11px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .seg button:hover { color: var(--text-0); }
  .seg button.on {
    background: var(--bg-elev);
    color: var(--text-0);
    font-weight: 500;
  }

  .controls .sep {
    width: 1px;
    height: 16px;
    background: var(--border);
  }

  .footnote {
    font-size: 11px;
    color: var(--text-2);
    text-align: center;
    line-height: 1.6;
    max-width: 420px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="window idle" id="win">
    <div class="titlebar">
      <div class="traffic"><i></i><i></i><i></i></div>
      <div class="title">Sweep</div>
    </div>

    <div class="content">
      <!-- 圆环 -->
      <div class="dial-wrap">
        <div class="dial-hit clickable" id="dialHit" role="button" tabindex="0" aria-label="开始清理">
          <svg class="dial" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="gradRun" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"/>
                <stop offset="100%"/>
              </linearGradient>
              <linearGradient id="gradDone" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"/>
                <stop offset="100%"/>
              </linearGradient>
            </defs>
            <circle class="breathe" cx="100" cy="100" r="88"/>
            <circle class="ring-track" cx="100" cy="100" r="88"
                    transform="rotate(-90 100 100)"/>
            <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="88"
                    transform="rotate(-90 100 100)"/>
            <circle class="ring-tip" id="ringTip" cx="100" cy="12" r="5"/>
          </svg>
        </div>

        <div class="dial-center" id="dialCenter">
          <div class="idle-label" id="idleLabel">开 始</div>
        </div>
      </div>

      <div class="status" id="status">点击圆环，开始清理</div>
      <div class="released" id="released"></div>

      <!-- 面板 -->
      <div class="panel">
        <!-- 待机 -->
        <div class="view active" id="viewHint">
          <div class="hint">
            <div class="hint-title">将扫描以下范围</div>
            <div class="hint-list">
              <span class="chip">应用缓存</span>
              <span class="chip">系统日志</span>
              <span class="chip">开发者工具</span>
              <span class="chip">浏览器</span>
              <span class="chip">应用残留</span>
              <span class="chip">大文件</span>
            </div>
            <div class="hint-note">
              全程在本机完成，不联网。<br>
              仅清理用户级内容，<b>不会索取管理员密码</b>。
            </div>
          </div>
        </div>

        <!-- 日志 -->
        <div class="view" id="viewLog">
          <div class="log" id="log"></div>
        </div>

        <!-- 结果 -->
        <div class="view" id="viewResult">
          <div class="result">
            <div class="res-cap">本次释放空间</div>
            <div class="res-big" id="resBig">272.2<span class="unit">MB</span></div>
            <div class="res-stats">
              <div class="stat">
                <div class="stat-num" id="resItems">18</div>
                <div class="stat-cap">清理项</div>
              </div>
              <div class="stat-div"></div>
              <div class="stat">
                <div class="stat-num" id="resCats">4</div>
                <div class="stat-cap">分类</div>
              </div>
            </div>
            <div class="res-disk">
              <span>磁盘可用</span>
              <span>184.41 GB</span>
              <span class="arrow">→</span>
              <span class="after" id="resDiskAfter">184.68 GB</span>
            </div>
          </div>
        </div>

        <!-- 详情清单 -->
        <div class="view" id="viewDetail">
          <div class="log" id="detail"></div>
        </div>
      </div>

      <div class="actions" id="actions">
        <button class="btn" id="btnDetail">查看详情</button>
        <button class="btn primary" id="btnAgain">完成</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="seg">
      <button data-speed="demo" class="on">演示节奏 15s</button>
      <button data-speed="real">真实节奏 50s</button>
    </div>
    <div class="sep"></div>
    <div class="seg">
      <button data-theme="dark" class="on">深色</button>
      <button data-theme="light">浅色</button>
    </div>
  </div>

  <div class="footnote">
    原型说明：进度节奏、模块耗时权重、清理明细均取自本机真实 <code>dry-run</code> 扫描结果（实测总耗时 50 秒）。
    「演示节奏」按 3.3 倍压缩，便于快速查看全流程。
  </div>
</div>

<script>
/* ============================================================
   真实清理数据 —— 全部来自本机 dry-run 实测输出
   weight 为模块耗时权重（总和 100），依据实测各模块扫描开销估算
   ============================================================ */
const SECTIONS = [
  { name: '用户基础项', weight: 12, items: [
    { t: '用户应用缓存', size: '78 KB', kind: 'cleaned' },
    { t: '用户应用日志', size: '4 KB',  kind: 'cleaned' },
  ]},
  { name: '应用缓存', weight: 10, items: [
    { t: 'Geod 临时文件', size: '0 B', kind: 'cleaned' },
  ]},
  { name: '浏览器', weight: 5, items: [
    { t: 'Dia 应用支持缓存', kind: 'skipped', note: 'Dia 正在运行' },
  ]},
  { name: '云服务与办公', weight: 3, items: [
    { t: '无需清理', kind: 'empty' },
  ]},
  { name: '开发者工具', weight: 38, items: [
    { t: 'npm 缓存',       kind: 'cleaned' },
    { t: 'npm 日志',       size: '1 KB', kind: 'cleaned' },
    { t: 'Corepack 缓存',  kind: 'cleaned' },
    { t: 'pip 缓存',       kind: 'cleaned' },
    { t: 'uv 缓存',        size: '48.0 MB',  kind: 'cleaned' },
    { t: 'Oh My Zsh 缓存', size: '1 KB',     kind: 'cleaned' },
    { t: 'Clang 模块缓存', size: '223.9 MB', kind: 'cleaned' },
    { t: '项目构建缓存',   kind: 'skipped', note: '3 个根目录扫描过慢' },
    { t: 'Codex 运行时',   kind: 'manual',  note: '需手动确认' },
  ]},
  { name: '应用与实用工具', weight: 6, items: [
    { t: 'Zsh 补全缓存', size: '169 KB', kind: 'cleaned' },
  ]},
  { name: '虚拟化',       weight: 3, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '应用支持文件', weight: 7, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '应用残留',     weight: 8, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: 'Apple 芯片更新', weight: 2, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '设备备份与固件', weight: 2, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '时间机器',     weight: 2, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '大文件',       weight: 2, items: [{ t: '无需清理', kind: 'empty' }] },
  { name: '项目产物',     weight: 0, items: [
    { t: '构建产物', kind: 'skipped', note: '需使用 purge 命令' },
  ]},
];

const TOTAL_KB = 278678.6;   // 实测汇总 ≈ 272.2 MB
const RELEASE_MB = 272.2;
const FREE_BEFORE = 184.41;
const ITEMS_CLEANED = 18;
const CATEGORIES = 4;

const DURATIONS = { demo: 15000, real: 50000 };
const MIN_SECTION_MS = 150;

/* ============ DOM ============ */
const $ = id => document.getElementById(id);
const win = $('win'), dialHit = $('dialHit'), dialCenter = $('dialCenter');
const ringProgress = $('ringProgress'), ringTip = $('ringTip');
const statusEl = $('status'), releasedEl = $('released');
const logEl = $('log'), detailEl = $('detail'), actionsEl = $('actions');
const views = {
  hint: $('viewHint'), log: $('viewLog'),
  result: $('viewResult'), detail: $('viewDetail'),
};

const R = 88;
const CIRC = 2 * Math.PI * R;
ringProgress.style.strokeDasharray = CIRC;
ringProgress.style.strokeDashoffset = CIRC;

/* ============ 状态 ============ */
let phase = 'idle';          // idle | running | done
let displayPct = 0;
let targetPct = 0;
let releasedKB = 0;
let runToken = 0;
let rafId = null;
let totalDuration = DURATIONS.demo;
let detailOpen = false;

/* ============ 工具 ============ */
function sleep(ms, token) {
  return new Promise((resolve, reject) => {
    setTimeout(() => token === runToken ? resolve() : reject(new Error('cancelled')), ms);
  });
}

function parseKB(str) {
  if (!str) return 0;
  const m = String(str).match(/([\d.]+)\s*(B|KB|MB|GB)/i);
  if (!m) return 0;
  const v = parseFloat(m[1]), u = m[2].toUpperCase();
  if (u === 'GB') return v * 1024 * 1024;
  if (u === 'MB') return v * 1024;
  if (u === 'KB') return v;
  return v / 1024;
}

function fmtMB(kb) {
  const mb = kb / 1024;
  return mb >= 1000 ? (mb / 1024).toFixed(2) + ' GB' : mb.toFixed(1) + ' MB';
}

function showView(name) {
  Object.entries(views).forEach(([k, el]) => el.classList.toggle('active', k === name));
}

/* ============ 圆环渲染 ============ */
function renderDial() {
  const pct = Math.max(0, Math.min(100, displayPct));
  ringProgress.style.strokeDashoffset = CIRC * (1 - pct / 100);

  // 进度头部光点
  if (phase === 'running' && pct > 0.8 && pct < 99.6) {
    const ang = (-90 + 360 * pct / 100) * Math.PI / 180;
    ringTip.setAttribute('cx', 100 + R * Math.cos(ang));
    ringTip.setAttribute('cy', 100 + R * Math.sin(ang));
    ringTip.classList.add('on');
  } else {
    ringTip.classList.remove('on');
  }

  // 中心数字
  if (phase === 'running') {
    const n = $('pctNum') || createPctNode();
    n.firstChild.nodeValue = Math.round(pct);
  }
}

function createPctNode() {
  dialCenter.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'pct'; d.id = 'pctNum';
  d.appendChild(document.createTextNode('0'));
  const u = document.createElement('span');
  u.className = 'unit'; u.textContent = '%';
  d.appendChild(u);
  dialCenter.appendChild(d);
  return d;
}

/* ============ 动画循环（时间基指数收敛，与帧率无关） ============ */
let lastT = performance.now();

function tick(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  const diff = targetPct - displayPct;
  if (Math.abs(diff) > 0.02) {
    displayPct += diff * (1 - Math.exp(-dt * 7));
    renderDial();
  } else if (displayPct !== targetPct) {
    displayPct = targetPct;
    renderDial();
  }
  rafId = requestAnimationFrame(tick);
}

/* ============ 日志条目 ============ */
const MARK = {
  cleaned: { cls: 'ok',   ch: '✓' },
  skipped: { cls: 'skip', ch: '○' },
  manual:  { cls: 'man',  ch: '·' },
  empty:   { cls: 'man',  ch: '✓' },
};

function appendSection(name) {
  const row = document.createElement('div');
  row.className = 'row sec';
  const mk = document.createElement('span');
  mk.className = 'mk sec'; mk.textContent = '▶';
  const lb = document.createElement('span');
  lb.className = 'label'; lb.textContent = name;
  row.append(mk, lb);
  logEl.appendChild(row);
}

function appendItem(item) {
  const row = document.createElement('div');
  row.className = 'row' + (item.kind === 'empty' ? ' dim' : '');

  const m = MARK[item.kind] || MARK.cleaned;
  const mk = document.createElement('span');
  mk.className = 'mk ' + m.cls;
  mk.textContent = m.ch;

  const lb = document.createElement('span');
  lb.className = 'label';
  lb.textContent = item.kind === 'empty' ? '无需清理' : item.t;

  row.append(mk, lb);

  if (item.size) {
    const sz = document.createElement('span');
    sz.className = 'size'; sz.textContent = item.size;
    row.appendChild(sz);
  } else if (item.note) {
    const nt = document.createElement('span');
    nt.className = 'note'; nt.textContent = item.note;
    row.appendChild(nt);
  }

  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}

/* ============ 主流程 ============ */
function calcDurations() {
  const nonBase = totalDuration - MIN_SECTION_MS * SECTIONS.length;
  SECTIONS.forEach(s => {
    s.duration = MIN_SECTION_MS + nonBase * s.weight / 100;
  });
}

async function run(token) {
  phase = 'running';
  calcDurations();

  win.classList.remove('idle');
  dialHit.classList.remove('clickable');
  createPctNode();
  showView('log');
  logEl.innerHTML = '';
  releasedEl.classList.add('on');

  try {
    await sleep(260, token);

    for (const sec of SECTIONS) {
      if (token !== runToken) return;

      statusEl.innerHTML = `正在清理 · <span class="sec-name">${sec.name}</span>`;
      appendSection(sec.name);

      const per = sec.duration / sec.items.length;

      for (const item of sec.items) {
        await sleep(per * 0.45, token);
        if (token !== runToken) return;

        appendItem(item);
        targetPct = Math.min(100, targetPct + sec.weight / sec.items.length);

        if (item.kind === 'cleaned' && item.size) {
          releasedKB += parseKB(item.size);
          releasedEl.textContent = `已释放 ${fmtMB(releasedKB)}`;
        }
        await sleep(per * 0.55, token);
      }
    }

    if (token !== runToken) return;
    targetPct = 100;

    // 等待进度条收口
    await sleep(520, token);
    finish();
  } catch (e) {
    /* 被取消 */
  }
}

function finish() {
  phase = 'done';

  // 数字 → 打勾
  dialCenter.innerHTML = `
    <svg class="check" viewBox="0 0 70 70">
      <path d="M20 36 L30 46 L51 25"/>
    </svg>`;
  ringProgress.classList.add('done');
  ringTip.classList.remove('on');

  statusEl.textContent = '清理完成';
  releasedEl.classList.remove('on');

  // 结果面板与实时累加同口径，保证前后一致
  const mb = releasedKB / 1024;
  $('resBig').innerHTML = mb >= 1000
    ? `${(mb / 1024).toFixed(2)}<span class="unit">GB</span>`
    : `${mb.toFixed(1)}<span class="unit">MB</span>`;

  logEl.scrollTop = logEl.scrollHeight;
  renderDetail();

  setTimeout(() => {
    showView('result');
    actionsEl.classList.add('on');
  }, 420);
}

/* ============ 详情清单 ============ */
function renderDetail() {
  detailEl.innerHTML = '';
  SECTIONS.forEach(sec => {
    appendSectionTo(detailEl, sec.name);
    sec.items.forEach(it => appendItemTo(detailEl, it));
  });
}

function appendSectionTo(parent, name) {
  const row = document.createElement('div');
  row.className = 'row sec';
  const mk = document.createElement('span');
  mk.className = 'mk sec'; mk.textContent = '▶';
  const lb = document.createElement('span');
  lb.className = 'label'; lb.textContent = name;
  row.append(mk, lb);
  parent.appendChild(row);
}

function appendItemTo(parent, item) {
  const row = document.createElement('div');
  row.className = 'row' + (item.kind === 'empty' ? ' dim' : '');
  const m = MARK[item.kind] || MARK.cleaned;
  const mk = document.createElement('span');
  mk.className = 'mk ' + m.cls; mk.textContent = m.ch;
  const lb = document.createElement('span');
  lb.className = 'label';
  lb.textContent = item.kind === 'empty' ? '无需清理' : item.t;
  row.append(mk, lb);
  if (item.size) {
    const sz = document.createElement('span');
    sz.className = 'size'; sz.textContent = item.size;
    row.appendChild(sz);
  } else if (item.note) {
    const nt = document.createElement('span');
    nt.className = 'note'; nt.textContent = item.note;
    row.appendChild(nt);
  }
  parent.appendChild(row);
}

/* ============ 重置 ============ */
function reset() {
  runToken++;
  phase = 'idle';
  displayPct = 0;
  targetPct = 0;
  releasedKB = 0;
  detailOpen = false;

  win.classList.add('idle');
  dialHit.classList.add('clickable');
  ringProgress.classList.remove('done');
  ringTip.classList.remove('on');

  dialCenter.innerHTML = '<div class="idle-label">开 始</div>';
  statusEl.textContent = '点击圆环，开始清理';
  releasedEl.classList.remove('on');
  releasedEl.textContent = '';
  actionsEl.classList.remove('on');
  logEl.innerHTML = '';
  $('btnDetail').textContent = '查看详情';

  showView('hint');
  renderDial();
}

/* ============ 交互绑定 ============ */
function start() {
  if (phase !== 'idle') return;
  reset();
  runToken++;
  run(runToken);
}

dialHit.addEventListener('click', start);
dialHit.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); }
});

$('btnDetail').addEventListener('click', () => {
  detailOpen = !detailOpen;
  $('btnDetail').textContent = detailOpen ? '返回结果' : '查看详情';
  showView(detailOpen ? 'detail' : 'result');
  if (detailOpen) detailEl.scrollTop = 0;
});

$('btnAgain').addEventListener('click', () => {
  if (detailOpen) {
    detailOpen = false;
    $('btnDetail').textContent = '查看详情';
  }
  reset();
});

/* 节奏切换 */
document.querySelectorAll('[data-speed]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    totalDuration = DURATIONS[btn.dataset.speed];
    if (phase !== 'idle') reset();
  });
});

/* 主题切换 */
document.querySelectorAll('[data-theme]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    document.documentElement.dataset.theme = btn.dataset.theme;
  });
});

/* ============ 启动 ============ */
ringProgress.style.strokeDashoffset = CIRC;
rafId = requestAnimationFrame(tick);
</script>
</body>
</html>
